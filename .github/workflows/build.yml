name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'ubuntu-latest' # self-hosted
  schedule:
    - cron: '0 0 */16 * *'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        stage: [1, 2, 3, 4]

    steps:
      - name: Check if APK is already built in previous stage
        id: check_done
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: titanium-browser-arm64-apk
          path: ./already_built

      - name: Checkout
        if: steps.check_done.outcome != 'success'
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Free Disk Space
        if: steps.check_done.outcome != 'success'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Update
        if: steps.check_done.outcome != 'success'
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          cd vanadium
          git fetch --tags
          git checkout $(git tag | sort -V | tail -n1)
          cd ..
          if [ "${{ matrix.stage }}" = "1" ]; then
            git add vanadium
            if ! git diff --staged --quiet; then
              git commit -am "update"
              git push || true
            fi
          fi

      - name: Cache depot_tools
        if: steps.check_done.outcome != 'success'
        uses: actions/cache@v4
        with:
          path: depot_tools
          key: depot-tools-v1

      - name: Restore Ninja build cache (out/Default)
        if: steps.check_done.outcome != 'success'
        uses: actions/cache/restore@v4
        with:
          path: chromium/src/out/Default
          key: ninja-out-default-${{ github.run_id }}-stage-${{ matrix.stage }}
          restore-keys: |
            ninja-out-default-${{ github.run_id }}-stage-
            ninja-out-default-

      - name: Set ENV
        if: steps.check_done.outcome != 'success'
        run: |
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV

      - name: Build (Stage ${{ matrix.stage }})
        if: steps.check_done.outcome != 'success'
        env:
          DEBIAN_FRONTEND: noninteractive
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
          BUILD_TIMEOUT: 260m
        run: |
          ./build.sh
          if [ -f chromium/src/out/Default/.ninja_log ]; then
            echo "=== Статистика сборки Ninja ==="
            echo -n "Выполнено шагов: "
            wc -l < chromium/src/out/Default/.ninja_log || true
            echo -n "Размер папки out/Default: "
            du -sh chromium/src/out/Default || true
          fi

      - name: Save Ninja build cache (out/Default)
        if: always() && steps.check_done.outcome != 'success'
        uses: actions/cache/save@v4
        with:
          path: chromium/src/out/Default
          key: ninja-out-default-${{ github.run_id }}-stage-${{ matrix.stage }}

      - name: Set
        if: steps.check_done.outcome != 'success'
        continue-on-error: true
        run: |
          export APK_FILE=$(find chromium/src/out/release -name '*arm64-v8a.apk' | head -n 1)
          if [ -n "$APK_FILE" ]; then
            export VERSION=$(basename "$APK_FILE" -arm64-v8a.apk)
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            cp "$APK_FILE" "$VERSION-${{ env.unix_time }}-arm64-v8a.apk"
          fi

      - name: Upload APKs Artifacts
        uses: actions/upload-artifact@v4
        if: steps.check_done.outcome != 'success' && env.VERSION != ''
        with:
          name: titanium-browser-arm64-apk
          path: |
            *.apk
            chromium/src/out/release/*.apk
            chromium/src/out/tmp/*.apk
          if-no-files-found: warn

      - name: Publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: steps.check_done.outcome != 'success' && env.VERSION != ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk

      - name: Attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        if: steps.check_done.outcome != 'success' && env.VERSION != ''
        with:
          subject-path: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
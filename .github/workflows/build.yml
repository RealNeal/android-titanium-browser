name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'ubuntu-latest' # self-hosted
  schedule:
    - cron: '0 0 */16 * *'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        stage: [1, 2, 3, 4, 5]

    steps:
      - name: Check if APK is already built in previous stage
        id: check_done
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: titanium-browser-arm64-apk
          path: ./already_built

      - name: Checkout
        if: steps.check_done.outcome != 'success'
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Free Disk Space
        if: steps.check_done.outcome != 'success'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Update
        if: steps.check_done.outcome != 'success'
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          cd vanadium
          git fetch --tags
          git checkout $(git tag | sort -V | tail -n1)
          cd ..
          if [ "${{ matrix.stage }}" = "1" ]; then
            git add vanadium
            if ! git diff --staged --quiet; then
              git commit -am "update"
              git push || true
            fi
          fi

      - name: Cache depot_tools
        if: steps.check_done.outcome != 'success'
        uses: actions/cache@v4
        with:
          path: depot_tools
          key: depot-tools-v1

      - name: Set ENV
        if: steps.check_done.outcome != 'success'
        run: |
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Restore Siso build cache (out/Default)
        if: steps.check_done.outcome != 'success'
        uses: actions/cache/restore@v4
        with:
          path: chromium/src/out/Default
          key: siso-out-default-${{ github.run_id }}-stage-${{ matrix.stage }}
          restore-keys: |
            siso-out-default-${{ github.run_id }}-stage-
            siso-out-default-

      - name: Restore build cache from GitHub Release (Fallback)
        if: steps.check_done.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f chromium/src/out/Default/build.ninja ]; then
            echo "Actions Cache пуст или не найден. Проверяем постоянный кэш в GitHub Releases..."
            mkdir -p /tmp/cache_download
            cd /tmp/cache_download
            
            # 1. Если это 1-й этап, сразу начинаем с кэша 4-го этапа
            if [ "${{ matrix.stage }}" = "1" ]; then
              echo "Начало сборки с кэша 4-го этапа (out-default-*-stage-4.tar.zst)..."
              gh release download build-cache -p "out-default-*-stage-4.tar.zst" || true
            else
              PREV_STAGE=$(( ${{ matrix.stage }} - 1 ))
              echo "Поиск кэша этапа $PREV_STAGE..."
              gh release download build-cache -p "out-default-*-stage-${PREV_STAGE}.tar.zst" || true
            fi
            
            # 2. Если нужный этап не найден, берем кэш 4-го этапа или любой доступный кэш
            if ! ls out-default-*.tar.zst 1>/dev/null 2>&1; then
              echo "Поиск кэша 4-го этапа в build-cache..."
              gh release download build-cache -p "out-default-*-stage-4.tar.zst" || gh release download build-cache -p "out-default-*.tar.zst" || true
            fi
            
            # 3. Если найден архив, распаковываем его в chromium/src
            LATEST_ARCHIVE=$(ls -t out-default-*.tar.zst 2>/dev/null | head -n 1)
            if [ -n "$LATEST_ARCHIVE" ]; then
              echo "Восстановление из архива: $LATEST_ARCHIVE"
              mkdir -p "$GITHUB_WORKSPACE/chromium/src"
              tar --zstd -xf "$LATEST_ARCHIVE" -C "$GITHUB_WORKSPACE/chromium/src"
              echo "Кэш успешно распакован из GitHub Release!"
            else
              echo "В GitHub Releases постоянный кэш пока не найден."
            fi
            cd "$GITHUB_WORKSPACE"
            rm -rf /tmp/cache_download
          else
            echo "Кэш out/Default уже успешно восстановлен из GitHub Actions Cache."
          fi

      - name: Build (Stage ${{ matrix.stage }})
        if: steps.check_done.outcome != 'success'
        env:
          DEBIAN_FRONTEND: noninteractive
          BUILD_TIMEOUT: 330m
        run: |
          ./build.sh
          if [ -d chromium/src/out/Default ]; then
            echo "=== Статистика сборки Siso ==="
            echo -n "Размер папки out/Default: "
            du -sh chromium/src/out/Default || true
            if [ -f chromium/src/out/Default/.siso_fs_state ]; then
              echo "Файл состояния Siso (.siso_fs_state) присутствует."
            fi
          fi

      - name: Save Siso build cache (out/Default)
        if: always() && steps.check_done.outcome != 'success'
        uses: actions/cache/save@v4
        with:
          path: chromium/src/out/Default
          key: siso-out-default-${{ github.run_id }}-stage-${{ matrix.stage }}

      - name: Save build cache to GitHub Release (Permanent)
        if: always() && steps.check_done.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f chromium/src/out/Default/build.ninja ]; then
            APK_READY=$(find chromium/src/out -name '*arm64-v8a.apk' 2>/dev/null | head -n 1)
            if [ -n "$APK_READY" ]; then
              echo "Финальный APK уже собран! Пропускаем выгрузку промежуточного кэша."
              exit 0
            fi

            ARCHIVE_NAME="out-default-${VERSION}-stage-${{ matrix.stage }}.tar.zst"
            echo "Создание постоянного архива $ARCHIVE_NAME..."
            tar -cf - -C chromium/src out/Default | zstd -T0 -5 -o "$ARCHIVE_NAME"
            echo "Размер архива: $(du -sh "$ARCHIVE_NAME" | cut -f1)"

            echo "Проверка наличия релиза build-cache..."
            gh release view build-cache >/dev/null 2>&1 || gh release create build-cache --title "Build Cache (Permanent)" --notes "Постоянное хранилище промежуточных сборок Siso out/Default" --prerelease

            echo "Выгрузка $ARCHIVE_NAME в релиз build-cache..."
            gh release upload build-cache "$ARCHIVE_NAME" --clobber
            rm -f "$ARCHIVE_NAME"
            echo "Кэш этапа ${{ matrix.stage }} успешно сохранён в GitHub Releases!"
          fi

      - name: Set
        if: steps.check_done.outcome != 'success'
        continue-on-error: true
        run: |
          export APK_FILE=$(find chromium/src/out/release -name '*arm64-v8a.apk' | head -n 1)
          if [ -n "$APK_FILE" ]; then
            export VERSION=$(basename "$APK_FILE" -arm64-v8a.apk)
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            cp "$APK_FILE" "$VERSION-${{ env.unix_time }}-arm64-v8a.apk"
          fi

      - name: Upload APKs Artifacts
        uses: actions/upload-artifact@v4
        if: steps.check_done.outcome != 'success' && env.VERSION != ''
        with:
          name: titanium-browser-arm64-apk
          path: |
            *.apk
            chromium/src/out/release/*.apk
            chromium/src/out/tmp/*.apk
          if-no-files-found: warn

      - name: Publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: steps.check_done.outcome != 'success' && env.VERSION != ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk

      - name: Attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        if: steps.check_done.outcome != 'success' && env.VERSION != ''
        with:
          subject-path: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
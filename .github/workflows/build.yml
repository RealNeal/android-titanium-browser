name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'self-hosted'
  schedule:
    - cron: '0 0 */16 * *'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'self-hosted' }}
    timeout-minutes: 2880 # 48 часов для полной чистой сборки на собственном сервере

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Update Vanadium
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          cd vanadium
          git fetch --tags
          git checkout $(git tag | sort -V | tail -n1)
          cd ..
          git add vanadium
          if ! git diff --staged --quiet; then
            git commit -am "update"
            git push || true
          fi

      - name: Set ENV
        run: |
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          ./build.sh
          if [ -d chromium/src/out/Default ]; then
            echo "=== Статистика сборки Siso ==="
            echo -n "Размер папки out/Default: "
            du -sh chromium/src/out/Default || true
          fi

      - name: Set APK info
        run: |
          export APK_FILE=$(find chromium/src/out/release -name '*arm64-v8a.apk' 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            export VERSION=$(basename "$APK_FILE" -arm64-v8a.apk)
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            cp "$APK_FILE" "$VERSION-${{ env.unix_time }}-arm64-v8a.apk"
          fi

      - name: Upload APKs Artifacts
        uses: actions/upload-artifact@v4
        if: env.VERSION != ''
        with:
          name: titanium-browser-arm64-apk
          path: |
            *.apk
            chromium/src/out/release/*.apk
            chromium/src/out/tmp/*.apk
          if-no-files-found: warn

      - name: Publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: env.VERSION != ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk

      - name: Attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        if: env.VERSION != ''
        with:
          subject-path: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'ubuntu-latest' # self-hosted
  schedule:
    - cron: '0 0 */16 * *'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h
      
      - name: Update 
        continue-on-error: true
        run: |
          cd vanadium
          git fetch --tags
          git checkout $(git tag | sort -V | tail -n1)
          cd ..
          git add vanadium
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --staged --quiet; then
            git commit -am "update"
            git push || true
          fi

      - name: Set ENV
        run: | 
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV
    
      - name: Build
        env:
            DEBIAN_FRONTEND: noninteractive
            LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
            STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
        run: |
          ./build.sh

      - name: Set
        continue-on-error: true
        run: |
          export APK_FILE=$(find chromium/src/out/release -name '*arm64-v8a.apk' | head -n 1)
          if [ -n "$APK_FILE" ]; then
            export VERSION=$(basename "$APK_FILE" -arm64-v8a.apk)
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            cp "$APK_FILE" "$VERSION-${{ env.unix_time }}-arm64-v8a.apk"
          fi

      - name: Upload APKs Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titanium-browser-arm64-apk
          path: |
            *.apk
            chromium/src/out/release/*.apk
            chromium/src/out/tmp/*.apk
          if-no-files-found: warn

      - name: Publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: env.VERSION != ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk

      - name: Attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        if: env.VERSION != ''
        with:
          subject-path: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk

name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'self-hosted'
  schedule:
    - cron: '0 0 */16 * *'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'self-hosted' }}
    timeout-minutes: 2880 # 48 часов для полной чистой сборки на собственном сервере

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vanadium
        run: |
          LATEST_TAG=$(git ls-remote --tags --sort='v:refname' https://github.com/GrapheneOS/Vanadium.git 2>/dev/null | grep -o 'refs/tags/[0-9].*' | sed 's#refs/tags/##; s#\^{}##' | sort -V | tail -n1 || true)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="156.0.8078.47.0"
          fi
          echo "Target Vanadium tag: $LATEST_TAG"

          rm -rf vanadium
          mkdir -p vanadium

          if [ -d "/home/ubuntu/vanadium_cache/$LATEST_TAG" ]; then
            echo "Using cached Vanadium $LATEST_TAG from runner host"
            cp -r "/home/ubuntu/vanadium_cache/$LATEST_TAG/"* vanadium/
          elif [ -f "/home/ubuntu/vanadium_cache/vanadium_$LATEST_TAG.tar.gz" ]; then
            echo "Extracting cached tarball for $LATEST_TAG"
            tar -xzf "/home/ubuntu/vanadium_cache/vanadium_$LATEST_TAG.tar.gz" --strip-components=1 -C vanadium/
          else
            echo "Downloading Vanadium archive for $LATEST_TAG..."
            if curl -fL --retry 5 --retry-delay 3 --http1.1 "https://github.com/GrapheneOS/Vanadium/archive/refs/tags/$LATEST_TAG.tar.gz" -o /tmp/v.tar.gz; then
              tar -xzf /tmp/v.tar.gz --strip-components=1 -C vanadium/
              mkdir -p "/home/ubuntu/vanadium_cache/$LATEST_TAG"
              cp -r vanadium/* "/home/ubuntu/vanadium_cache/$LATEST_TAG/"
              rm -f /tmp/v.tar.gz
            else
              echo "Warning: Download failed, falling back to existing cache..."
              EXISTING_CACHE=$(find /home/ubuntu/vanadium_cache/ -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)
              if [ -n "$EXISTING_CACHE" ]; then
                echo "Using fallback cache from $EXISTING_CACHE"
                cp -r "$EXISTING_CACHE/"* vanadium/
              else
                echo "Error: No Vanadium source or cache available!"
                exit 1
              fi
            fi
          fi

          echo "Vanadium setup completed. args.gn version:"
          grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn || true

      - name: Set ENV
        run: |
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          ./build.sh
          if [ -d chromium/src/out/Default ]; then
            echo "=== Статистика сборки Siso ==="
            echo -n "Размер папки out/Default: "
            du -sh chromium/src/out/Default || true
          fi

      - name: Set APK info
        run: |
          export APK_FILE=$(find chromium/src/out/release -name '*arm64-v8a.apk' 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            export VERSION=$(basename "$APK_FILE" -arm64-v8a.apk)
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            cp "$APK_FILE" "$VERSION-${{ env.unix_time }}-arm64-v8a.apk"
          fi

      - name: Upload APKs Artifacts
        uses: actions/upload-artifact@v4
        if: env.VERSION != ''
        with:
          name: titanium-browser-arm64-apk
          path: |
            *.apk
            chromium/src/out/release/*.apk
            chromium/src/out/tmp/*.apk
          if-no-files-found: warn

      - name: Publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: env.VERSION != ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk

      - name: Attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        if: env.VERSION != ''
        with:
          subject-path: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk